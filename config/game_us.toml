# Recompiler input for the USA release's default.xbe, written by xbe_symbols, the game's names matched from Europe's

[xbe]
path = "assets/default.xbe"
title = 0x5454001A
entry = 0x11652
xdk = 5849
out = "generated/game"
partitions = 128
code_sections = [".text", "D3D", "XGRPH", "XACTENG", "XONLINE", "XNET", "BINK", "BINK32", "BINK32A", "BINK16", "BINK4444", "BINK5551", "BINKYUY2", "BINK16MX", "BINK16X2", "BINK16M", "BINK32MX", "BINK32X2", "BINK32M", "DSOUND", "WMADEC", "XPP"]
named = true  # functions bind by name, so one executable runs every release
library = "RDR.dll"  # <exe>.dll, which the executable delay loads

# extra entry points
[functions]

