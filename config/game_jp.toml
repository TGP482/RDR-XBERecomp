# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# XACT engine clock: the APU sample counter comes from the host, the register is not mapped
[[hook]]
at = 0x352571
call = "ReadSampleTime"
on_true = 0x352576

# the follow camera pivot has just read its bearing: the mouse turns it (src/game/mouse.cpp)
[[hook]]
at = 0x2A8A88
call = "FollowCameraBearing"

# the frame's end has swapped: no vertical blank wait, the host paces frames (src/game/frame_rate.cpp)
[[hook]]
at = 0x17D9FF
call = "SkipVBlankWait"
on_true = 0x17DA32

# the press start screen's frame has drawn: no sleep to the console's frame length (src/game/frame_rate.cpp)
[[hook]]
at = 0x69581
call = "SkipPressStartSleep"
on_true = 0x695C7

# frames times the console's frame length, the screen transition's step (src/game/frame_rate.cpp)
[[hook]]
at = 0x1076FC
after = true
call = "FrameStepSt0"

# the console's frame length, the fade after a load's step
[[hook]]
at = 0x708E0
after = true
call = "FrameStepSt0"

# the console's frame length, the load show's step
[[hook]]
at = 0x6783F
after = true
call = "FrameStepEax"

# the load show's sun on a wide screen: no 0.75 x squash, its 2D narrows to 4:3 (src/game/hud_widescreen.cpp)
[[hook]]
at = 0x67C8B
call = "LoadShowSunRound"
on_true = 0x67C93

# the coach physics' step loop: steps every frame, a step's worth per vertical blank (src/game/frame_rate.cpp)
[[hook]]
at = 0x209450
call = "CoachPhysicsSteps"

# the bridge's cannon counts: the second team's starts, so each team keeps to its own side (src/game/hud_widescreen.cpp)
[[hook]]
at = 0x1D5B78
call = "CannonCountSecondTeam"
